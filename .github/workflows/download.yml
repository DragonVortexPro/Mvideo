name: YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: "YouTube URLs (separate multiple links with space)"
        required: true
        type: string
      quality:
        description: "Quality"
        required: false
        default: "1080"
        type: choice
        options:
          - best
          - 1080
          - 720
          - 480
          - audio
      password:
        description: "Zip password (optional - leave empty for no password)"
        required: false
        default: ""
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start WARP
        run: |
          docker network create warp-net || true
          docker run -d --name warp --restart=always --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP..."
          for i in {1..10}; do
            if curl -s --max-time 4 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -qE "warp=(on|plus)"; then
              echo "WARP is ready"
              break
            fi
            echo "Attempt $i..."
            sleep 3
          done

      - name: Setup yt-dlp + ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ffmpeg: true
          aria2: true

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip p7zip-full

      - name: Download Videos
        env:
          URLS: ${{ github.event.inputs.video_urls }}
          QUALITY: ${{ github.event.inputs.quality }}
          PASSWORD: ${{ github.event.inputs.password }}
        run: |
          mkdir -p videos

          case "$QUALITY" in
            audio)  FORMAT="bestaudio/best" ;;
            1080)   FORMAT="bestvideo[height<=1080]+bestaudio/best" ;;
            720)    FORMAT="bestvideo[height<=720]+bestaudio/best" ;;
            480)    FORMAT="bestvideo[height<=480]+bestaudio/best" ;;
            *)      FORMAT="bestvideo+bestaudio/best" ;;
          esac

          read -ra URL_LIST <<< "$URLS"
          echo "Total links: ${#URL_LIST[@]}"

          for URL in "${URL_LIST[@]}"; do
            echo "========================================"
            echo "Downloading: $URL"
            echo "========================================"

            yt-dlp \
              --proxy "socks5://127.0.0.1:1080" \
              --format "$FORMAT" \
              --merge-output-format mp4 \
              --write-thumbnail \
              --convert-thumbnails jpg \
              --output "videos/%(title)s.%(ext)s" \
              --no-playlist \
              --retries 10 \
              --fragment-retries 10 \
              --downloader aria2c \
              --downloader-args "aria2c:-x 16 -s 16" \
              "$URL" || echo "Failed: $URL"
          done

          # Zip with password if provided
          if [ -n "$PASSWORD" ]; then
            echo "Creating password protected zips..."
            cd videos
            for f in *.mp4 *.webm *.mkv *.mp3; do
              [ -f "$f" ] || continue
              zip -P "$PASSWORD" "${f%.*}.zip" "$f"
              rm -f "$f"
            done
            cd ..
          fi

          echo "Download finished"
          ls -lh videos/

      - name: Stop WARP
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true

      - name: Generate Gallery
        run: |
          python3 << 'EOF'
          from pathlib import Path

          videos_dir = Path("videos")
          files = list(videos_dir.glob("*.mp4")) + list(videos_dir.glob("*.webm")) + \
                  list(videos_dir.glob("*.mkv")) + list(videos_dir.glob("*.mp3")) + \
                  list(videos_dir.glob("*.zip"))

          cards = ""
          for f in sorted(files, key=lambda x: x.stat().st_mtime, reverse=True):
              name = f.stem
              thumb = None
              for ext in [".jpg", ".webp", ".png"]:
                  t = videos_dir / f"{name}{ext}"
                  if t.exists():
                      thumb = t.name
                      break

              if thumb:
                  thumb_html = f'''
                    <a href="{f.name}" download title="Click to download">
                      <img src="{thumb}" alt="{name}">
                    </a>'''
              else:
                  thumb_html = f'''
                    <a href="{f.name}" download class="no-thumb">
                      No Image - Click to Download
                    </a>'''

              cards += f'''
              <div class="card">
                <div class="thumb">{thumb_html}</div>
                <div class="info">
                  <h3>{name}</h3>
                  <a class="btn" href="{f.name}" download>Download</a>
                </div>
              </div>'''

          html = f'''<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Gallery</title>
  <style>
    body {{
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #eee;
    }}
    header {{
      text-align: center;
      padding: 30px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
    }}
    h1 {{ margin: 0 0 8px 0; }}
    .grid {{
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }}
    .card {{
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #333;
      transition: transform 0.2s;
    }}
    .card:hover {{ transform: translateY(-4px); }}
    .thumb {{
      aspect-ratio: 16/9;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }}
    .thumb a {{ display: block; width: 100%; height: 100%; }}
    .thumb img {{
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.3s;
      cursor: pointer;
    }}
    .thumb img:hover {{ transform: scale(1.03); opacity: 0.9; }}
    .no-thumb {{
      color: #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-decoration: none;
    }}
    .info {{ padding: 14px; }}
    h3 {{
      margin: 0 0 12px 0;
      font-size: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }}
    .btn {{
      display: inline-block;
      padding: 8px 14px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
    }}
    .btn:hover {{ background: #2563eb; }}
    .empty {{
      text-align: center;
      padding: 80px 20px;
      color: #777;
      grid-column: 1 / -1;
    }}
  </style>
</head>
<body>
  <header>
    <h1>YouTube Gallery</h1>
    <div>Click on the image to download</div>
  </header>
  <div class="grid">
    {cards if cards else '<div class="empty">No videos yet.</div>'}
  </div>
</body>
</html>'''

          with open("videos/index.html", "w", encoding="utf-8") as f:
              f.write(html)
          print("Gallery created")
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add videos/
          git diff --cached --quiet || git commit -m "Add downloaded videos"
          git push

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: videos

      - name: Deploy
        uses: actions/deploy-pages@v4
